function useInView(threshold = 0.12) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) setInView(true); }, { threshold });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, inView];
}

function useCounter(target, active, duration = 1600) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    if (!active) return;
    let start = null;
    const step = ts => {
      if (!start) start = ts;
      const p = Math.min((ts - start) / duration, 1);
      setVal(Math.floor(p * target));
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }, [active, target]);
  return val;
}

          <a href={project.demo} target="_blank" rel="noreferrer" style={{ padding:"12px 24px", borderRadius:12, fontSize:14, fontWeight:600, background:`linear-gradient(135deg,${project.color},${project.color}bb)`, color:"#fff", boxShadow:`0 0 24px ${project.color}50` }}>↗ Live Demo</a>
        )}
      </div>
    </div>
  );
}

// ── PROJECTS SECTION ──────────────────────────────────────────────────────────

function Projects({ dark }) {
  const [filter, setFilter] = useState("All");
  const [search, setSearch] = useState("");
  const [ref, inView] = useInView(0.05);

  const filtered = PROJECTS.filter(p => {
    const mf = filter==="All" || p.categories.includes(filter);
    const q = search.toLowerCase();
    const ms = !q || p.title.toLowerCase().includes(q) || p.tech.some(t => t.toLowerCase().includes(q)) || p.categories.some(c => c.toLowerCase().includes(q));
    return mf && ms;
  });

  const featured = filtered.filter(p => p.featured);
  const rest = filtered.filter(p => !p.featured);

  const sectionBg = dark ? "#070b18" : "#f1f5f9";

  return (
    <section id="projects" style={{ padding:"120px 1.5rem", background:sectionBg, position:"relative", overflow:"hidden" }}>
      <Blob style={{ width:600, height:600, top:"20%", right:-200, background:"radial-gradient(circle,#8b5cf6,#06b6d4)" }} />

      <div style={{ maxWidth:1200, margin:"0 auto" }}>
        <div ref={ref} style={{ textAlign:"center", marginBottom:56, transform: inView?"translateY(0)":"translateY(40px)", opacity: inView?1:0, transition:"all .6s ease" }}>
          <span style={{ fontSize:12, fontWeight:700, letterSpacing:".15em", textTransform:"uppercase", color:"#8b5cf6", marginBottom:12, display:"block" }}>Portfolio</span>
          <h2 style={{ fontSize:"clamp(2rem,5vw,3.5rem)", fontWeight:800, color: dark?"#fff":"#0f172a", margin:"0 0 16px" }}>All Projects</h2>
          <p style={{ fontSize:17, color: dark?"rgba(255,255,255,0.5)":"rgba(15,23,42,0.55)", maxWidth:520, margin:"0 auto" }}>Cloud infrastructure, automation, security, and AI — all in one place.</p>
        </div>

        {/* Search */}
        <div style={{ maxWidth:480, margin:"0 auto 36px", position:"relative" }}>
          <span style={{ position:"absolute", left:16, top:"50%", transform:"translateY(-50%)", fontSize:18, pointerEvents:"none" }}>🔍</span>
          <input value={search} onChange={e => setSearch(e.target.value)}
            placeholder="Search projects or technologies…"
            style={{ width:"100%", padding:"14px 16px 14px 48px", borderRadius:14, fontSize:15, background: dark?"rgba(255,255,255,0.06)":"rgba(255,255,255,0.95)", border:`1px solid ${dark?"rgba(255,255,255,0.1)":"rgba(0,0,0,0.1)"}`, color: dark?"#fff":"#0f172a", outline:"none" }} />
        </div>

        {/* Filters */}
        <div style={{ display:"flex", flexWrap:"wrap", gap:8, justifyContent:"center", marginBottom:60 }}>
          {CATEGORIES.map(cat => (
            <button key={cat} onClick={() => setFilter(cat)} style={{
              padding:"8px 18px", borderRadius:100, fontSize:13, fontWeight:600, cursor:"pointer",
              background: filter===cat ? "linear-gradient(135deg,#f97316,#ec4899)" : (dark?"rgba(255,255,255,0.06)":"rgba(0,0,0,0.05)"),
              border: filter===cat ? "none" : `1px solid ${dark?"rgba(255,255,255,0.1)":"rgba(0,0,0,0.08)"}`,
              color: filter===cat ? "#fff" : (dark?"rgba(255,255,255,0.65)":"rgba(0,0,0,0.65)"),
              boxShadow: filter===cat ? "0 0 20px rgba(249,115,22,0.35)" : "none",
              transition:"all .25s",
            }}>{cat}</button>
          ))}
        </div>

        {featured.length > 0 && (
          <>
            <p style={{ fontSize:12, fontWeight:700, letterSpacing:".1em", textTransform:"uppercase", color: dark?"rgba(255,255,255,0.35)":"rgba(0,0,0,0.35)", marginBottom:20 }}>⭐ Featured Projects</p>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(320px,1fr))", gap:24, marginBottom:64 }}>
              {featured.map(p => <FeaturedCard key={p.id} project={p} dark={dark} />)}
            </div>
          </>
        )}

        {rest.length > 0 && (
          <>
            <p style={{ fontSize:12, fontWeight:700, letterSpacing:".1em", textTransform:"uppercase", color: dark?"rgba(255,255,255,0.3)":"rgba(0,0,0,0.3)", marginBottom:20 }}>All Projects</p>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(290px,1fr))", gap:20 }}>
              {rest.map((p,i) => <ProjectCard key={p.id} project={p} dark={dark} delay={i*80} />)}
            </div>
          </>
        )}

        {filtered.length === 0 && (
          <div style={{ textAlign:"center", padding:"80px 0", color: dark?"rgba(255,255,255,0.3)":"rgba(0,0,0,0.3)" }}>
            <div style={{ fontSize:48, marginBottom:16 }}>🔍</div>
            <p style={{ fontSize:18 }}>No projects match your search.</p>
          </div>
        )}
      </div>
    </section>
  );
}

// ── ABOUT ─────────────────────────────────────────────────────────────────────

function StatNum({ stat, active }) {
  const v = useCounter(stat.value, active);
  return (
    <div style={{ textAlign:"center", padding:"24px 16px" }}>
      <div style={{ fontSize:"clamp(1.8rem,4vw,2.8rem)", fontWeight:800, background:"linear-gradient(135deg,#f97316,#ec4899)", WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent" }}>{v}{stat.suffix}</div>
      <div style={{ fontSize:13, marginTop:8, color:"rgba(255,255,255,0.45)" }}>{stat.label}</div>
    </div>
  );
}

function About({ dark }) {
  const [hRef, hIn] = useInView(0.05);
  const [sRef, sIn] = useInView(0.1);
  const [stRef, stIn] = useInView(0.1);

  return (
    <section id="about" style={{ padding:"120px 1.5rem", background: dark?"#050810":"#fff", position:"relative", overflow:"hidden" }}>
      <Blob style={{ width:500, height:500, bottom:-100, left:-100, background:"radial-gradient(circle,#f97316,#ec4899)" }} />

      <div style={{ maxWidth:1200, margin:"0 auto" }}>
        <div ref={hRef} style={{ textAlign:"center", marginBottom:72, transform: hIn?"translateY(0)":"translateY(40px)", opacity: hIn?1:0, transition:"all .6s ease" }}>
          <span style={{ fontSize:12, fontWeight:700, letterSpacing:".15em", textTransform:"uppercase", color:"#ec4899", marginBottom:12, display:"block" }}>About</span>
          <h2 style={{ fontSize:"clamp(2rem,5vw,3.5rem)", fontWeight:800, color: dark?"#fff":"#0f172a", margin:"0 0 16px" }}>Skills & Expertise</h2>
        </div>

        {/* Stats */}
        <div ref={stRef} style={{ background:"linear-gradient(135deg,rgba(249,115,22,0.1),rgba(139,92,246,0.1))", border:"1px solid rgba(255,255,255,0.08)", borderRadius:24, display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))", marginBottom:80 }}>
          {STATS.map(s => <StatNum key={s.label} stat={s} active={stIn} />)}
        </div>

        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))", gap:56 }}>
          {/* Skill bars */}
          <div ref={sRef}>
            <h3 style={{ fontSize:20, fontWeight:700, color: dark?"#fff":"#0f172a", marginBottom:32 }}>Technical Skills</h3>
            {SKILLS.map((sk, i) => (
              <div key={sk.name} style={{ marginBottom:20 }}>
                <div style={{ display:"flex", justifyContent:"space-between", marginBottom:8 }}>
                  <span style={{ fontSize:14, fontWeight:600, color: dark?"rgba(255,255,255,0.8)":"#0f172a" }}>{sk.icon} {sk.name}</span>
                  <span style={{ fontSize:13, color:"#f97316", fontWeight:700 }}>{sk.level}%</span>
                </div>
                <div style={{ height:6, borderRadius:100, background: dark?"rgba(255,255,255,0.08)":"rgba(0,0,0,0.08)", overflow:"hidden" }}>
                  <div style={{ height:"100%", borderRadius:100, background:"linear-gradient(90deg,#f97316,#ec4899)", width: sIn?`${sk.level}%`:"0%", transition:`width 1.2s ease ${i*60}ms`, boxShadow:"0 0 12px rgba(249,115,22,0.5)" }} />
                </div>
              </div>
            ))}
          </div>

          {/* Certs + Roadmap */}
          <div>
            <h3 style={{ fontSize:20, fontWeight:700, color: dark?"#fff":"#0f172a", marginBottom:28 }}>Certifications</h3>
            <div style={{ display:"flex", flexDirection:"column", gap:14, marginBottom:48 }}>
              {CERTS.map((c,i) => (
                <div key={c.name} style={{ display:"flex", alignItems:"center", gap:16, background: dark?"rgba(255,255,255,0.04)":"rgba(0,0,0,0.03)", border:`1px solid ${dark?"rgba(255,255,255,0.08)":"rgba(0,0,0,0.07)"}`, borderRadius:14, padding:"15px 18px", transform: sIn?"translateX(0)":"translateX(40px)", opacity: sIn?1:0, transition:`all .5s ease ${i*100}ms` }}>
                  <div style={{ width:42, height:42, borderRadius:12, background:c.color+"22", border:`1px solid ${c.color}40`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:18, flexShrink:0 }}>🏆</div>
                  <div>
                    <div style={{ fontSize:14, fontWeight:700, color: dark?"#fff":"#0f172a" }}>{c.name}</div>
                    <div style={{ fontSize:12, color: dark?"rgba(255,255,255,0.45)":"rgba(0,0,0,0.45)" }}>{c.org} · {c.year}</div>
                  </div>
                </div>
              ))}
            </div>

            <h3 style={{ fontSize:20, fontWeight:700, color: dark?"#fff":"#0f172a", marginBottom:24 }}>Learning Roadmap</h3>
            {ROADMAP.map((item,i) => (
              <div key={item.label} style={{ display:"flex", gap:14, alignItems:"center", marginBottom:20 }}>
                <div style={{ width:26, height:26, borderRadius:"50%", flexShrink:0, background: item.done?item.color:"transparent", border:`2px solid ${item.color}`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:12, color: item.done?"#fff":item.color, fontWeight:700 }}>{item.done?"✓":"○"}</div>
                <span style={{ fontSize:14, color: item.done?(dark?"rgba(255,255,255,0.8)":"#0f172a"):(dark?"rgba(255,255,255,0.4)":"rgba(0,0,0,0.4)"), fontWeight: item.done?600:400 }}>{item.label}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </section>
  );
}

// ── CONTACT ───────────────────────────────────────────────────────────────────

function Contact({ dark }) {
  const [ref, inView] = useInView(0.1);

  const links = [
    { label:"GitHub", desc:"See all my repos", icon:"⬡", href:"https://github.com/dhairya", color:"#f97316" },
    { label:"LinkedIn", desc:"Connect professionally", icon:"in", href:"https://linkedin.com", color:"#0ea5e9" },
    { label:"Email", desc:"dhairya@example.com", icon:"✉", href:"mailto:dhairya@example.com", color:"#22c55e" },
    { label:"Resume", desc:"Download PDF", icon:"↓", href:"#", color:"#8b5cf6" },
  ];

  return (
    <section id="contact" style={{ padding:"120px 1.5rem", background: dark?"#070b18":"#f1f5f9", position:"relative", overflow:"hidden" }}>
      <Blob style={{ width:500, height:500, top:-100, right:-100, background:"radial-gradient(circle,#8b5cf6,#ec4899)" }} />

      <div style={{ maxWidth:800, margin:"0 auto", textAlign:"center" }}>
        <div ref={ref} style={{ transform: inView?"translateY(0)":"translateY(40px)", opacity: inView?1:0, transition:"all .6s ease" }}>
          <span style={{ fontSize:12, fontWeight:700, letterSpacing:".15em", textTransform:"uppercase", color:"#06b6d4", marginBottom:12, display:"block" }}>Contact</span>
          <h2 style={{ fontSize:"clamp(2rem,5vw,3.5rem)", fontWeight:800, color: dark?"#fff":"#0f172a", margin:"0 0 16px" }}>Let's Connect</h2>
          <p style={{ fontSize:17, color: dark?"rgba(255,255,255,0.5)":"rgba(15,23,42,0.55)", maxWidth:500, margin:"0 auto 56px" }}>Open to new opportunities, collaborations, and interesting conversations about cloud, DevOps, and security.</p>
        </div>

        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))", gap:20 }}>
          {links.map((l,i) => (
            <a key={l.label} href={l.href}
              target={l.href.startsWith("http") ? "_blank" : undefined}
              rel="noreferrer"
              style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:12, padding:28, borderRadius:20, background: dark?"rgba(255,255,255,0.04)":"rgba(255,255,255,0.9)", border:`1px solid ${dark?"rgba(255,255,255,0.08)":"rgba(0,0,0,0.07)"}`, transition:"all .3s", transform: inView?"translateY(0)":"translateY(30px)", opacity: inView?1:0, transitionDelay:`${i*80}ms` }}
              onMouseEnter={e => { e.currentTarget.style.transform="translateY(-6px)"; e.currentTarget.style.boxShadow=`0 12px 40px ${l.color}30`; e.currentTarget.style.borderColor=l.color+"50"; }}
              onMouseLeave={e => { e.currentTarget.style.transform="translateY(0)"; e.currentTarget.style.boxShadow="none"; e.currentTarget.style.borderColor=dark?"rgba(255,255,255,0.08)":"rgba(0,0,0,0.07)"; }}
            >
              <div style={{ width:50, height:50, borderRadius:14, background:l.color+"18", border:`1px solid ${l.color}40`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:20, color:l.color, fontWeight:800 }}>{l.icon}</div>
              <div style={{ fontSize:15, fontWeight:700, color: dark?"#fff":"#0f172a" }}>{l.label}</div>
              <div style={{ fontSize:12, color: dark?"rgba(255,255,255,0.45)":"rgba(0,0,0,0.45)", textAlign:"center" }}>{l.desc}</div>
            </a>
          ))}
        </div>

        <p style={{ marginTop:64, fontSize:13, color: dark?"rgba(255,255,255,0.22)":"rgba(0,0,0,0.25)" }}>
          Built with React · Hosted on GitHub Pages / Vercel · © {new Date().getFullYear()} Dhairya
        </p>
      </div>
    </section>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────

function App() {
  const [dark, setDark] = useState(true);

  useEffect(() => {
    document.body.className = dark ? "" : "light";
  }, [dark]);

  return (
    <div style={{ minHeight:"100vh", fontFamily:"'Space Grotesk',system-ui,sans-serif" }}>
      <Navbar dark={dark} setDark={setDark} />
      <Hero dark={dark} />
      <Projects dark={dark} />
      <About dark={dark} />
      <Contact dark={dark} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
